# SPF 메일 스캔 (P2-8 Phase 1, 읽기 전용) — 평일 08:20 KST, 아침 브리핑(08:40) 직전.
# Gmail label:SPF 답장을 읽어 리드에 온도분석 결과를 남긴다. 발송·초안·라벨변경 없음(읽기 전용).
# 결과는 리드의 "다음 액션/다음 액션일"에 기록 → 오늘 챙길 리드(P1-6)·아침 브리핑에 자동 노출.
# delivery=silent: 자체 텔레그램 발송 안 함(브리핑이 대신 알림). 개인 Gmail이라 label:SPF로 범위 최소화.
loop:
  id: spf-mail-scan
  version: "1"
  owner: genie
  description: "SPF 메일 스캔 (Gmail label:SPF 답장 → 리드 온도분석, 읽기 전용)"
  enabled: true

  trigger:
    type: cron
    cron: "20 8 * * 1-5"
    timezone: Asia/Seoul
    catch_up: skip

  steps:
    - id: mail-scan
      agent: spf-sales
      model_tier: cheap
      prompt: >
        [SPF 메일 스캔 · 읽기 전용] 개인 Gmail의 SPF 라벨 답장을 읽어 리드에 반응 온도를 남겨라.

        하드 룰(엄수):
        - Gmail은 읽기 전용. 메일 발송·초안 생성·라벨 변경·삭제 절대 금지. 조회 도구만 사용.
        - 웹 검색 금지. 지어내지 않는다. 확신 없으면 보류하고 그렇게 적는다.
        - 범위는 SPF 라벨로 한정. 라벨 밖 개인 메일은 읽지 않는다.

        1) Gmail 커넥터로 "label:SPF newer_than:2d" 스레드를 조회한다(읽기 전용). 없으면 이 한 줄만
        답하고 종료: [[QUIET]]

        2) 각 스레드에서 고객이 보낸 답장 본문을 읽는다. 발신자·회사명을 파악한다.

        3) Notion "영업 리드" DB(data_source b3765c80-7cae-46a0-9203-5cc21783fa2f)를 조회해
        회사명으로 매칭한다. 매칭되는 기존 리드가 없으면 리드를 새로 만들지 말고 그 건은 건너뛴다
        (Phase 1은 기존 리드 갱신만).

        4) 답장 본문의 반응 온도를 판정한다 — HOT/WARM/COOL/NQ. 한국어 정중체 완곡 거절 주의:
        "검토 후 연락", "추후/다음 기회", "참고하겠습니다", "내부 검토 필요"는 겉보기 따뜻해도
        감점 신호다. "미팅/샘플/견적/발주"는 가점 신호. 판정 근거를 한 줄로 남긴다.

        5) 매칭된 리드를 Notion update-page로 갱신한다(스코어 밴드는 건드리지 않는다 — 참고 지표):
        - "다음 액션" = 기존 값이 있으면 앞에 덧붙여, "[답장온도 {온도} · {오늘날짜}] {한줄근거}" 형식.
        - "다음 액션일" = 오늘 날짜(사람이 오늘 확인하도록).
        온도는 자동 확정이 아니라 사람 확인용 제안임을 근거 문구에 포함한다.

        6) 완료 요약(1~3줄): 처리한 답장 수, 갱신한 리드(회사·제안온도), 매칭 안 된 건 수.

  budget:
    max_cost_usd_per_run: 1
    max_duration_minutes: 10
    max_runs_per_day: 1
    monthly_cap_usd: 10

  approval:
    mode: draft_only

  delivery:
    on_success: silent
    on_failure: full

  expiry:
    review_after_days: 30
