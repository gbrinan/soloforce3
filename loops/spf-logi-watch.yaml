# SPF 물류 경고 감시 — 평일 14:00 KST. 오후 한 번 콜드체인 경고를 점검한다.
# 경고가 없으면 산출물에 [[QUIET]]를 넣어 발송을 건너뛴다(runner의 QUIET 센티넬) → 맑은 날엔 무음.
# A안과 정합: Notion 정본을 조회만 한다. 콘솔 EXCURSION은 "Notion으로 내보내기" 시점에 감시 대상이 된다.
loop:
  id: spf-logi-watch
  version: "1"
  owner: genie
  description: "SPF 물류 경고 감시 (EXCURSION·QA보류) → 있을 때만 텔레그램"
  enabled: true

  trigger:
    type: cron
    cron: "0 14 * * 1-5"
    timezone: Asia/Seoul
    catch_up: skip

  steps:
    - id: logi-watch
      agent: spf-logistics
      model_tier: cheap
      prompt: >
        [SPF 물류 경고 감시] Notion "물류 배송" DB만 조회해 콜드체인 경고를 점검하라.

        하드 룰: 웹 검색 금지. Notion 쓰기 금지(조회만). 지어내지 않는다.
        "[예시]"로 표시된 예시행은 실데이터가 아니므로 경고 집계에서 제외한다.

        "물류 배송" DB(data_source 18c2a1e7-0186-41f0-b1bd-bf021f2c643b)를 조회해,
        콜드체인 판정이 EXCURSION이거나 단계가 HELD_QA인 실데이터 건을 모은다.

        - 실경고가 하나도 없으면(예시행 제외) 정확히 이 한 줄만 답한다: [[QUIET]]
        - 실경고가 있으면 아래 형식으로만 답한다(서론·맺음말 금지):

        SPF 물류 경고 (YYYY-MM-DD HH:MM)
        - 경고 N건
          · PO · 단계 · 판정 · (원 리드 있으면 회사)
        - 권장: 격리 → 온도이력 기록 → QA/담당 통보

  budget:
    max_cost_usd_per_run: 1
    max_duration_minutes: 10
    max_runs_per_day: 1
    monthly_cap_usd: 10

  approval:
    mode: draft_only

  delivery:
    on_success: full
    on_failure: full

  expiry:
    review_after_days: 30
