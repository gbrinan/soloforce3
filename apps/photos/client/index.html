<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MyCrew Photos</title>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<style>
  /* ===== mycrew-system 디자인 토큰 (단일 소스) =====
     ⚠️ 새 컴포넌트 추가 시 hex 코드 직접 사용 금지 — 반드시 아래 :root 변수 사용.
     라이트 모드는 html[data-theme="light"]에서 자동 분기. */
  :root {
    color-scheme: light dark;
    /* Dark theme — 마이크루 디자인 시스템 정본(네이비 표면 + 인디고 액센트) */
    --bg-canvas: #04070F;
    --bg-surface: #070D1A;
    --bg-card: #0F1726;
    --bg-muted: #151F32;
    --bg-elevated: #1B2740;
    --bg-accent: #1B2740;
    --text-primary: #F8F8F8;
    --text-secondary: #9DB7EB;
    --text-muted: #7D8699;
    --border-default: #1F293D;
    --border-subtle: #151F32;
    --ring: #6366F1;
    --ring-strong: #818CF8;
    --ring-soft: rgba(99,102,241,0.16);
    --ring-shadow: rgba(99,102,241,0.32);
    --hover-overlay: rgba(255,255,255,0.04);
    --hover-overlay-strong: rgba(255,255,255,0.08);
    --topbar-bg: rgba(4,7,15,0.78);
    --accent-success: #34D399;
    --accent-danger: #F87171;
    --accent-warning: #FBBF24;
    --accent-info: #818CF8;
    --font-s: 12px;
    --font-m: 14px;
    --font-l: 16px;
    --font-xl: 18px;
    --font-2xl: 22px;
    --font-label: 11px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --radius-pill: 999px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.20);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.35);
    --shadow-lg: 0 12px 36px rgba(0,0,0,0.45);
    --shadow-focus: 0 0 0 3px var(--ring-shadow);
    --overlay-canvas: rgba(4,7,15,0.86);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --t-fast: 150ms;
    --t-base: 200ms;
    --t-slow: 300ms;
  }
  html[data-theme="light"] {
    --bg-canvas: #ffffff;
    --bg-surface: #ffffff;
    --bg-card: #ffffff;
    --bg-muted: #f1f3f4;
    --bg-elevated: #e8eaed;
    --bg-accent: #efeaff;
    --text-primary: #1f1f1f;
    --text-secondary: #3c4043;
    --text-muted: #5f6368;
    --border-default: #e8eaed;
    --border-subtle: #f1f3f4;
    --ring: #7c3aed;
    --ring-strong: #6d28d9;
    --ring-soft: rgba(124,58,237,0.10);
    --ring-shadow: rgba(124,58,237,0.22);
    --hover-overlay: rgba(0,0,0,0.04);
    --hover-overlay-strong: rgba(0,0,0,0.08);
    --topbar-bg: rgba(255,255,255,0.78);
    --accent-success: #047857;
    --accent-danger: #DC2626;
    --accent-warning: #B45309;
    --accent-info: #4F46E5;
    --shadow-sm: 0 1px 2px rgba(60,64,67,0.08);
    --shadow-md: 0 2px 10px rgba(60,64,67,0.14);
    --shadow-lg: 0 12px 32px rgba(60,64,67,0.20);
    --overlay-canvas: rgba(255,255,255,0.92);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { transition: background-color var(--t-slow) var(--ease-out); }
  body { font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
                     'Segoe UI', 'Noto Sans KR', sans-serif;
         background: var(--bg-canvas); color: var(--text-primary);
         min-height: 100vh; min-height: 100dvh; display: flex; font-size: var(--font-m);
         -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
         letter-spacing: -0.01em;
         transition: background-color var(--t-slow) var(--ease-out),
                     color var(--t-slow) var(--ease-out); }

  /* Sidebar — Google Photos style pill nav */
  .sidebar { width: 240px; flex: 0 0 240px; min-width: 240px;
             background: var(--bg-surface);
             padding: 20px 12px; display: flex; flex-direction: column; gap: 2px;
             overflow-y: auto;
             transition: width var(--t-base) var(--ease-out),
                         flex-basis var(--t-base) var(--ease-out),
                         min-width var(--t-base) var(--ease-out),
                         padding var(--t-base) var(--ease-out); }
  .sidebar.collapsed { width: 68px; flex: 0 0 68px; min-width: 68px; padding: 20px 6px; }
  .sidebar.collapsed .sidebar-item { padding: 10px 8px; justify-content: center; gap: 0; }
  .sidebar.collapsed .sidebar-item > span:nth-child(2),
  .sidebar.collapsed .sidebar-count,
  .sidebar.collapsed .sidebar-section { display: none; }
  .sidebar.collapsed .sidebar-divider { margin: 8px 4px; }
  /* margin-top: -8px → 햄버거 버튼 중심을 topbar 검색 박스 중심선(상단 32px)에 정렬.
     사이드바 padding-top(20) - 8 + 40/2 = 32px == topbar padding-top(12) + search-box(40)/2. */
  .sidebar-toggle { background: transparent; border: none; color: var(--text-secondary);
                    font-size: 18px; cursor: pointer; padding: 8px 12px;
                    margin: -8px 0 8px; border-radius: var(--radius-pill);
                    display: flex; align-items: center; justify-content: center;
                    width: 40px; height: 40px; align-self: flex-start;
                    transition: background-color var(--t-base) var(--ease-out),
                                color var(--t-base) var(--ease-out); }
  .sidebar-toggle:hover { background: var(--hover-overlay); color: var(--text-primary); }
  .sidebar.collapsed .sidebar-toggle { align-self: center; }
  /* 모바일 햄버거(topbar) — 데스크톱 숨김, 모바일 미디어쿼리에서 inline-flex */
  .mobile-menu-btn { display: none; background: transparent; border: none;
                     color: var(--text-secondary); cursor: pointer;
                     width: 36px; height: 36px; border-radius: var(--radius-pill);
                     font-size: 20px; line-height: 1;
                     align-items: center; justify-content: center; flex: 0 0 auto; }
  .mobile-menu-btn:hover { background: var(--hover-overlay); color: var(--text-primary); }
  .sidebar-backdrop { display: none; }
  .sidebar-section { font-size: var(--font-label); font-weight: 600;
                     color: var(--text-muted); text-transform: uppercase;
                     letter-spacing: 1.5px; padding: 12px 16px 6px;
                     user-select: none; }
  .sidebar-item { position: relative; padding: 10px 16px;
                  border-radius: var(--radius-pill);
                  cursor: pointer; font-size: var(--font-m); font-weight: 500;
                  color: var(--text-secondary);
                  display: flex; align-items: center; gap: 14px;
                  white-space: nowrap; overflow: hidden;
                  transition: background-color var(--t-base) var(--ease-out),
                              color var(--t-base) var(--ease-out); }
  .sidebar-item > span { white-space: nowrap; }
  .sidebar-item > span:first-child { font-size: 18px; line-height: 1; flex-shrink: 0;
                                     width: 22px; text-align: center; }
  .sidebar-item > span:nth-child(2) { flex: 1 1 auto; min-width: 0;
                                      overflow: hidden; text-overflow: ellipsis; }
  .sidebar-item:hover { background: var(--hover-overlay); color: var(--text-primary); }
  .sidebar-item.active { background: var(--ring-soft); color: var(--ring);
                         font-weight: 600; }
  .sidebar-count { margin-left: auto; flex-shrink: 0;
                   font-size: var(--font-s); color: var(--text-muted);
                   font-weight: 500; }
  .sidebar-item.active .sidebar-count { color: var(--ring); }
  .bc-scan-btn { display: none; background: transparent; border: 0; cursor: pointer;
                 padding: 0 4px; margin-left: 4px; font-size: 14px;
                 color: var(--text-muted); flex-shrink: 0; line-height: 1; }
  body.embedded .bc-scan-btn { display: inline-flex; align-items: center; }
  .bc-scan-btn:hover { color: var(--ring); }
  .sidebar.collapsed .bc-scan-btn { display: none; }
  .sidebar-divider { height: 1px; background: var(--border-subtle); margin: 12px 8px; }

  /* Main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column;
          background: var(--bg-canvas); }
  .topbar { position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; flex-wrap: wrap;
            gap: 10px; padding: 12px 20px;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--topbar-bg);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%); }
  .topbar h1 { margin: 0; font-size: var(--font-xl); font-weight: 600;
               white-space: nowrap; flex-shrink: 0;
               color: var(--text-primary); letter-spacing: -0.02em; }
  .topbar .grow { flex: 1 1 auto; min-width: 0; }

  /* Search pill — Google Photos style */
  .search-wrapper { position: relative; flex: 1 1 320px;
                    min-width: 160px; max-width: 540px; }
  .search-wrapper::before { content: '🔎'; position: absolute; left: 16px; top: 50%;
                            transform: translateY(-50%); font-size: 16px;
                            opacity: 0.6; pointer-events: none; line-height: 1; }
  .search-box { width: 100%; height: 36px;
                padding: 0 16px 0 44px; border-radius: var(--radius-sm);
                background: var(--bg-muted); border: 1px solid transparent;
                color: var(--text-primary); font-size: var(--font-m);
                font-family: inherit;
                transition: background-color var(--t-base) var(--ease-out),
                            border-color var(--t-base) var(--ease-out),
                            box-shadow var(--t-base) var(--ease-out); }
  .search-box::placeholder { color: var(--text-muted); }
  .search-box:hover { background: var(--bg-elevated); }
  .search-box:focus { outline: none; background: var(--bg-surface);
                      border-color: var(--ring);
                      box-shadow: var(--shadow-focus); }
  /* Standalone (non-search) date input keeps pill shape, no icon */
  input.search-box[type="date"] { padding: 0 16px; height: 36px;
                                  border-radius: var(--radius-sm);
                                  background: var(--bg-muted);
                                  color: var(--text-primary); }
  input.search-box[type="date"]:hover { background: var(--bg-elevated); }
  input.search-box[type="date"]:focus { background: var(--bg-surface); }

  .btn { height: 36px; padding: 0 16px; border-radius: var(--radius-md);
         border: 1px solid transparent; cursor: pointer; font-size: var(--font-m);
         background: transparent; color: var(--text-primary); font-weight: 500;
         white-space: nowrap; flex-shrink: 0;
         display: inline-flex; align-items: center; justify-content: center; gap: 8px;
         font-family: inherit;
         transition: background-color var(--t-base) var(--ease-out),
                     color var(--t-base) var(--ease-out),
                     border-color var(--t-base) var(--ease-out),
                     box-shadow var(--t-base) var(--ease-out),
                     filter var(--t-base) var(--ease-out); }
  .btn:hover { background: var(--hover-overlay); }
  .btn.primary { background: var(--ring); color: #ffffff; font-weight: 600;
                 box-shadow: 0 1px 2px rgba(0,0,0,0.18); }
  .btn.primary:hover { background: var(--ring-strong); filter: none;
                       box-shadow: 0 4px 14px var(--ring-shadow); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.icon { width: 36px; height: 36px; padding: 0; border-radius: var(--radius-md);
              display: inline-flex; align-items: center; justify-content: center;
              background: transparent; font-size: var(--font-l); }
  .btn.icon:hover { background: var(--hover-overlay); }
  .btn:focus-visible { outline: none; box-shadow: var(--shadow-focus); }

  /* Toggle group active state (settings theme/lang buttons) */
  .btn.toggle-opt.active,
  .modal-card .btn.toggle-opt.active,
  .modal-overlay .btn.toggle-opt.active { background: var(--ring); color: #ffffff; font-weight: 600;
                            border-color: var(--ring);
                            box-shadow: 0 0 0 2px var(--ring-shadow), 0 1px 2px rgba(0,0,0,0.22); }
  .btn.toggle-opt.active:hover,
  .modal-card .btn.toggle-opt.active:hover { background: var(--ring-strong); color: #ffffff; }

  /* Map markers: thumbnail + photo-count badge */
  .map-thumb-marker { position: relative; width: 56px; height: 56px; border-radius: 50%;
                      background: var(--bg-surface); border: 2px solid var(--ring);
                      box-shadow: 0 4px 14px var(--ring-shadow); cursor: pointer;
                      overflow: visible; }
  .map-thumb-marker img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .map-thumb-marker .map-thumb-badge { position: absolute; top: -6px; right: -6px;
                                       min-width: 22px; height: 22px; padding: 0 6px;
                                       background: var(--ring); color: #ffffff; border-radius: 11px;
                                       border: 2px solid var(--bg-surface);
                                       font-size: 12px; font-weight: 700; line-height: 18px;
                                       text-align: center; box-sizing: border-box; }

  /* Date range row in toolbar */
  .date-range-row { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .date-range-row .date-range-sep { color: var(--text-muted); font-size: 13px; }

  /* Confirm/prompt modal (iframe-safe replacement for window.prompt) */
  .ui-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55);
                      display: none; align-items: center; justify-content: center; z-index: 9999; }
  .ui-modal-overlay.show { display: flex; }
  .ui-modal-card { background: var(--bg-surface); padding: 24px; border-radius: var(--radius-md);
                    min-width: 320px; max-width: 480px; box-shadow: 0 24px 64px rgba(0,0,0,0.4); }
  .ui-modal-card h4 { margin: 0 0 12px 0; font-size: var(--font-l); color: var(--text-primary); }
  .ui-modal-card input { width: 100%; padding: 10px 14px; border-radius: var(--radius-pill);
                          background: var(--bg-muted); border: 1px solid transparent;
                          color: var(--text-primary); font-size: var(--font-m); font-family: inherit;
                          box-sizing: border-box; margin-bottom: 16px; }
  .ui-modal-card input:focus { outline: none; border-color: var(--ring); box-shadow: var(--shadow-focus); }
  .ui-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .ui-modal-actions .btn.primary.danger { background: var(--accent-danger); color: #ffffff; }
  .ui-modal-actions .btn.primary.danger:hover { filter: brightness(1.08); }

  /* Embedded mode — mycrew 셸 iframe 내부일 때 자체 헤더 h1 숨김 (이중 헤더 차단).
     셸이 ?embedded=1 파라미터를 박지 않더라도 window.self !== window.top일 때
     자동으로 body.embedded 클래스가 부여되어 동작한다. */
  body.embedded .topbar h1 { display: none; }
  body.embedded .topbar { padding-top: 8px; padding-bottom: 8px; }
  input[type=file] { display: none; }

  .container { padding: 16px; flex: 1; overflow-y: auto; }

  /* Memories */
  .memories { margin-bottom: 24px; padding: 16px;
              background: var(--bg-card); border-radius: var(--radius-md);
              border: 1px solid var(--border-default); }
  .memories h3 { margin: 0 0 12px; font-size: var(--font-m); color: var(--text-primary); }
  .memories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .memory-card { aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden;
                 position: relative; cursor: pointer; background: var(--bg-muted); }
  .memory-card img { width: 100%; height: 100%; object-fit: cover; }
  .memory-label { position: absolute; bottom: 4px; left: 4px; right: 4px; text-align: center;
                  background: var(--overlay-canvas); padding: 4px;
                  border-radius: var(--radius-sm); font-size: var(--font-s); font-weight: 600;
                  color: var(--text-primary); }

  /* Map */
  #map-container { width: 100%; height: 100%; }
  #map { width: 100%; height: 100%; }
  .maplibregl-popup-content { background: var(--bg-surface); color: var(--text-primary);
                              padding: 12px; border-radius: var(--radius-sm);
                              border: 1px solid var(--border-default);
                              box-shadow: var(--shadow-md); }
  .maplibregl-popup-content img { width: 120px; height: 120px; object-fit: cover;
                                  border-radius: var(--radius-sm); margin-bottom: 8px; }
  .maplibregl-popup-close-button { color: var(--text-primary); }

  .empty { padding: 120px 24px; text-align: center; color: var(--text-muted);
           max-width: 480px; margin: 0 auto; }
  .empty .big { font-size: 72px; line-height: 1; margin-bottom: 24px; opacity: 0.35;
                filter: grayscale(0.2); }
  .empty strong { font-size: var(--font-xl); color: var(--text-primary);
                  font-weight: 500; display: block; margin-bottom: 8px;
                  letter-spacing: -0.01em; }
  .empty .hint { font-size: var(--font-m); margin-top: 8px;
                 color: var(--text-secondary); line-height: 1.55; }
  .empty .hint b { color: var(--text-primary); font-weight: 600; }
  .month { margin: 28px 0 14px; font-size: var(--font-m); font-weight: 600;
           color: var(--text-secondary); border-bottom: 1px solid var(--border-subtle);
           padding-bottom: 10px; letter-spacing: -0.005em; display: flex; align-items: center; }
  .month .count { font-weight: 400; color: var(--text-muted); margin-left: 10px;
                  font-size: var(--font-s); }
  .month-checkbox { margin-right: 10px; width: 18px; height: 18px; cursor: pointer;
                    accent-color: var(--primary, #007bff); flex-shrink: 0; }
  .grid { display: grid;
          grid-template-columns: repeat(auto-fill, minmax(var(--thumb-size, 140px), 1fr));
          gap: 6px; touch-action: pan-y pinch-zoom; }
  .thumb-zoom-group { display: inline-flex; align-items: center; gap: 2px;
                      border: 1px solid var(--border-default); border-radius: var(--radius-md);
                      padding: 2px; background: var(--bg-surface); }
  .thumb-zoom-group .btn { width: 36px; height: 36px; padding: 0; min-width: 0;
                            border-radius: var(--radius-sm);
                            border: none; background: transparent;
                            display: inline-flex; align-items: center; justify-content: center;
                            font-size: var(--font-m);
                            transition: background var(--t-base) var(--ease-out); }
  .thumb-zoom-group .btn:hover { background: var(--hover-overlay); }
  .thumb-zoom-group .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  /* Modal form controls — Mycrew styled input/select with right-padded native arrow */
  .mc-modal-input, .mc-modal-select {
    width: 100%; padding: 10px 12px; box-sizing: border-box;
    border: 1px solid var(--border-default); border-radius: var(--radius-md);
    background: var(--bg-elevated); color: var(--text-primary);
    font: inherit; font-size: var(--font-m); line-height: 1.4;
    transition: border-color var(--t-base) var(--ease-out),
                box-shadow var(--t-base) var(--ease-out);
  }
  .mc-modal-input:hover, .mc-modal-select:hover { border-color: var(--text-secondary); }
  .mc-modal-input:focus, .mc-modal-select:focus {
    outline: none; border-color: var(--ring);
    box-shadow: var(--shadow-focus);
  }
  .mc-modal-select {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    padding-right: 36px; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1.5L6 6.5L11 1.5' stroke='%23666' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 12px 8px;
  }
  .mc-modal-select::-ms-expand { display: none; }
  .mc-modal-label {
    display: block; font-size: var(--font-s); margin-bottom: 6px;
    color: var(--text-muted);
  }
  /* 선택 모드 토글 시각화 */
  #btn-select-mode[aria-pressed="true"] { background: var(--ring); color: #fff; border-color: var(--ring); }
  .tile { aspect-ratio: 1 / 1; background: var(--bg-muted);
          border-radius: var(--radius-md); overflow: hidden;
          cursor: pointer; position: relative;
          transition: transform var(--t-base) var(--ease-out),
                      box-shadow var(--t-base) var(--ease-out); }
  .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .noimg { width: 100%; height: 100%; display: flex; align-items: center;
                 justify-content: center; color: var(--text-muted); font-size: var(--font-s); }
  .tile-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px;
                  opacity: 0; transition: opacity 0.15s; }
  .tile:hover .tile-actions { opacity: 1; }
  .tile-action { width: 28px; height: 28px; border-radius: var(--radius-sm);
                 background: var(--overlay-canvas); color: var(--text-primary);
                 border: none; cursor: pointer; font-size: var(--font-m);
                 display: flex; align-items: center; justify-content: center; }
  .tile-action:hover { background: var(--bg-muted); }
  .tile-action.active { background: var(--ring); color: white; }
  .tile-action.kebab { font-weight: bold; font-size: 18px; line-height: 1; }
  /* Tile overflow dropdown — appended to <body>, positioned via JS */
  .tile-menu {
    position: fixed; z-index: 9999; min-width: 180px;
    background: var(--bg-elevated, #fff); color: var(--text-primary);
    border: 1px solid var(--border-default, #ccc); border-radius: var(--radius-md, 8px);
    box-shadow: var(--shadow-md, 0 6px 24px rgba(0,0,0,0.18));
    padding: 4px; display: none;
  }
  .tile-menu.open { display: block; }
  .tile-menu button {
    display: block; width: 100%; text-align: left;
    padding: 8px 12px; border: none; background: transparent;
    color: inherit; cursor: pointer; font: inherit; font-size: var(--font-s, 13px);

<script>
  /* iframe-mount-aware base path. 호스트(3457)가 /api/apps/<id>/proxy/ 하위로 마운트해도
     `/api/...` 절대경로 fetch/이미지가 호스트 root로 가서 404 나는 문제 차단.
     단독(3201) 시 location.pathname이 / 라 BASE=''로 라우팅 무변경. */
  (function () {
    var m = (location.pathname || '').match(/^(.*\/proxy)(\/|$)/);
    var APP_BASE = m ? m[1] : '';
    window.APP_BASE = APP_BASE;
    window.appUrl = function (path) {
      if (!APP_BASE || typeof path !== 'string') return path;
      if (path.charAt(0) !== '/' || path.indexOf('//') === 0) return path;
      if (path.indexOf(APP_BASE + '/') === 0) return path;
      return APP_BASE + path;
    };
    window.rewriteAssetUrlsDeep = function (obj) {
      if (!APP_BASE || !obj) return;
      if (Array.isArray(obj)) { for (var i = 0; i < obj.length; i++) window.rewriteAssetUrlsDeep(obj[i]); return; }
      if (typeof obj !== 'object') return;
      for (var k in obj) {
        var v = obj[k];
        if (typeof v === 'string' && v.charAt(0) === '/' && v.indexOf('/api/') === 0 && v.indexOf(APP_BASE + '/') !== 0) obj[k] = APP_BASE + v;
        else if (v && typeof v === 'object') window.rewriteAssetUrlsDeep(v);
      }
    };
    if (APP_BASE) {
      var origFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        if (typeof input === 'string') input = window.appUrl(input);
        return origFetch(input, init);
      };
    }
  })();
</script>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
(function() {
  // Host origin: dynamic resolution so postMessage targetOrigin tracks the actual parent
  // (mycrew-system PORT=3457 in .env diverges from the legacy 3456 default).
  var HOST_ORIGIN = (function() {
    try {
      var ao = (window.location && window.location.ancestorOrigins) || null;
      if (ao && ao.length > 0) return ao[0];
    } catch (_) {}
    try { if (document.referrer) return new URL(document.referrer).origin; } catch (_) {}
    return 'http://127.0.0.1:3457';
  })();
  var currentFilter = 'library';
  var searchDebounce = null;
  var map = null;
  var mapMarkers = [];
  var selectionMode = false;
  var selectedPhotos = new Set();
  var lastSelectedSha = null;
  var currentAlbumId = null;

  // Cross-origin drag-and-drop bridge: postMessage single channel.
  // 과거 dataTransfer setData (uri-list / plain / html / x-mycrew-photo-url) 와 postMessage 를
  // 동시에 발신 → 호스트 dedup 부작용으로 0 건 첨부 회귀 발생. 단일 경로(postMessage drag.start)로
  // 통합하여 호스트 ChatPanel.handleDrop 의 window.__mycrewDropUrl 폴백만 활성화한다.
  // 명함 모드는 별도 채널(application/x-mycrew-contact-ref + contact.dragstart) 만 사용.
  window.__photoDragStart = function(e, sha, mediaType) {
    if (mediaType === 'video' || !sha) return;
    try {
      var url = location.origin + window.appUrl('/api/library/asset/' + sha + '/original');
      // cursor visualization only — no dataTransfer URL payload.
      try { e.dataTransfer.effectAllowed = 'copy'; } catch (_) {}
      // 명함 모드: contact-ref 전용 경로 (사진 URL bridge 생략 → 호스트 합산 중복 방지)
      if (currentFilter === 'businesscards') {
        var contactRef = { type: 'businesscard-ref', sha256: sha };
        try { e.dataTransfer.setData('application/x-mycrew-contact-ref', JSON.stringify(contactRef)); } catch (_) {}
        try { window.parent.postMessage({ source: 'mycrew-photos', type: 'contact.dragstart', payload: contactRef }, HOST_ORIGIN); } catch (_) {}
        return;
      }
      // 일반 사진: postMessage 단일 경로 — 호스트가 window.__mycrewDropUrl 에 스테이징
      try { window.parent.postMessage({ source: 'mycrew-photos', type: 'drag.start', payload: { url: url } }, HOST_ORIGIN); } catch (_) {}
    } catch (err) { /* noop */ }
  };

  // Notify host on drag end so the host bridge can clear the staged URL.
  document.addEventListener('dragend', function() {
    try { window.parent.postMessage({ source: 'mycrew-photos', type: 'drag.end' }, HOST_ORIGIN); } catch (_) {}
  }, true);
  
  var busStatus = document.getElementById('bus-status');
  var toast = document.getElementById('toast');
  var emptyState = document.getElementById('empty-state');
  var timeline = document.getElementById('timeline');
  var memoriesSection = document.getElementById('memories-section');
  var mapContainer = document.getElementById('map-container');
  var albumsContainer = document.getElementById('albums-container');
  var albumDetailContainer = document.getElementById('album-detail-container');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');
  var lightboxSidebar = document.getElementById('lightbox-sidebar');
  var pageTitle = document.getElementById('page-title');
  var searchBox = document.getElementById('search-box');
  var selectionBar = document.getElementById('selection-bar');
  var selectionCount = document.getElementById('selection-count');
  var chatOpen = false;

  // ----- postMessage <-> host -----
  function postHost(type, payload) {
    if (!window.parent || window.parent === window) return;
    window.parent.postMessage({ source: 'mycrew-photos', type: type, payload: payload || {} }, HOST_ORIGIN);
  }

  // FAB 제거됨 — 호스트가 chat.open/close를 자체 FAB로 트리거.
  // postHost('chat.open', { context })는 사진앱 뷰 컨텍스트가 필요할 때 다른 경로로 호출 가능.

  window.addEventListener('message', function(e) {
    if (e.origin !== HOST_ORIGIN) return;
    var d = e.data;
    if (!d || d.source !== 'mycrew-host') return;
    if (d.type === 'chat.state' && d.payload && typeof d.payload.open === 'boolean') {
      chatOpen = d.payload.open;
      // FAB 제거됨 — 시각 토글 대상 없음. chatOpen state만 유지.
    }
  });

  // ----- Toast -----
  var toastTimer = null;
  function showToast(text, ms) {
    toast.textContent = text;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, ms || 3000);
  }

  // ----- Business Card Scan (host POST /api/contacts/scan) -----
  /* photos 단독 모드(3201)에는 라우트가 없고, 마이크루 호스트 iframe 임베드 시
     same-origin proxy 루트("/api/contacts/scan") 호출이 호스트 라우터에 직접
     도달한다. body.embedded 클래스로만 버튼이 노출되며, 안전망으로 비임베드
     상태에서는 안내 토스트만 띄운다. */
  (function() {
    var scanBtn = document.getElementById('btn-bc-scan');
    var scanInput = document.getElementById('bc-scan-input');
    if (!scanBtn || !scanInput) return;
    var scanning = false;
    scanBtn.addEventListener('click', function(ev) {
      ev.stopPropagation();
      ev.preventDefault();
      if (!document.body.classList.contains('embedded')) {
        showToast('호스트 앱(마이크루)에서 실행해 주세요');
        return;
      }
      if (scanning) { showToast('명함 스캔 진행 중입니다'); return; }
      scanInput.value = '';
      scanInput.click();
    });
    scanInput.addEventListener('change', function(ev) {
      var file = (ev.target.files && ev.target.files[0]) || null;
      if (!file) return;
      scanning = true;
      var fd = new FormData();
      fd.append('image', file);
      showToast('명함 스캔 중...', 30000);
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, 30000);
      var opts = { method: 'POST', body: fd };
      if (ctrl) opts.signal = ctrl.signal;
      fetch('/api/contacts/scan', opts).then(function(r) {
        return r.text().then(function(t) {
          var body = null;
          try { body = t ? JSON.parse(t) : null; } catch (e) { body = null; }
          return { ok: r.ok, status: r.status, body: body, raw: t };
        });
      }).then(function(res) {
        clearTimeout(timer);
        scanning = false;
        if (res.ok && res.body && res.body.ok) {
          var c = res.body.contact || {};
          var name = c.name || c.fullName || '(이름 없음)';
          var method = res.body.method || 'unknown';
          showToast('연락처 추가됨: ' + name + ' (' + method + ')', 4000);
          var cEl = document.getElementById('count-businesscards');
          if (cEl) {
            api('/api/library/counts').then(function(cnt) {
              cEl.textContent = cnt.businesscards || 0;
            }).catch(function() {});
          }
          if (typeof currentFilter !== 'undefined' && currentFilter === 'businesscards'
              && typeof refreshView === 'function') {
            try { refreshView(); } catch (e) {}
          }
        } else {
          var msg = (res.body && res.body.error)
            || (res.status ? ('HTTP ' + res.status) : '응답 오류');
          showToast('명함 스캔 실패: ' + msg, 5000);
        }
      }).catch(function(err) {
        clearTimeout(timer);
        scanning = false;
        if (err && err.name === 'AbortError') {
          showToast('명함 스캔 시간 초과 (30초)', 5000);
        } else {
          var m = (err && err.message) ? err.message : '네트워크 오류';
          showToast('명함 스캔 실패: ' + m, 5000);
        }
      });
    });
  })();

  // ----- Selection mode -----
  function toggleSelectionMode() {
    selectionMode = !selectionMode;
    selectedPhotos.clear();
    lastSelectedSha = null;
    selectionBar.classList.toggle('show', selectionMode);
    updateSelectionCount();
    
    var bSel = document.getElementById('btn-select-mode');
    if (selectionMode) {
      bSel.setAttribute('data-i18n', 'common.selectModeOn');
      bSel.textContent = window.t ? window.t('common.selectModeOn') : '✓ 선택 모드 (켜짐)';
      bSel.setAttribute('aria-pressed', 'true');
      timeline.querySelectorAll('.tile').forEach(function(tile) {
        tile.classList.add('selectable');
      });
    } else {
      bSel.setAttribute('data-i18n', 'common.selectMode');
      bSel.textContent = window.t ? window.t('common.selectMode') : '✓ 선택 모드';
      bSel.setAttribute('aria-pressed', 'false');
      timeline.querySelectorAll('.tile').forEach(function(tile) {
        tile.classList.remove('selectable', 'selected');
      });
    }
    // 월별 헤더 체크박스는 selectionMode 의존이므로 timeline 재렌더링이 가장 안전.
    if (typeof refreshView === 'function') refreshView();
  }

  // 지도 화면에서는 선택 모드 토글 + 선택 바를 숨긴다. (currentFilter는 클로저 변수)
  function updateSelectionToggleVisibility() {
    var bSel = document.getElementById('btn-select-mode');
    var isMap = (typeof currentFilter !== 'undefined' && currentFilter === 'map');
    if (bSel) bSel.style.display = isMap ? 'none' : '';
    if (isMap && selectionMode) {
      // 선택 모드 강제 해제 (refreshView 재호출 회피)
      selectionMode = false;
      selectedPhotos.clear();
      lastSelectedSha = null;
      selectionBar.classList.toggle('show', false);
      updateSelectionCount();
      bSel.setAttribute('data-i18n', 'common.selectMode');
      bSel.textContent = window.t ? window.t('common.selectMode') : '✓ 선택 모드';
      bSel.setAttribute('aria-pressed', 'false');
    }
  }

  function updateSelectionCount() {
    selectionCount.textContent = window.t ? window.t('common.selectedCount', { count: selectedPhotos.size }) : (selectedPhotos.size + '개 선택됨');
  }

  function updateMonthCheckboxStates() {
    if (!selectionMode) return;
    timeline.querySelectorAll('.month-checkbox').forEach(function(checkbox) {
      var monthKey = checkbox.getAttribute('data-month-key');
      var monthTiles = Array.from(timeline.querySelectorAll('.tile[data-month-key="' + monthKey + '"]'));
      if (monthTiles.length === 0) return;
      
      // Use selectedPhotos Set as source of truth — DOM .selected class may lag by a frame
      var selectedCount = monthTiles.filter(function(tile) {
        return selectedPhotos.has(tile.getAttribute('data-sha'));
      }).length;
      
      var allSelected = selectedCount === monthTiles.length;
      var someSelected = selectedCount > 0 && selectedCount < monthTiles.length;
      
      checkbox.checked = allSelected;
      checkbox.indeterminate = someSelected;
    });
  }

  function togglePhotoSelection(sha) {
    if (selectedPhotos.has(sha)) {
      selectedPhotos.delete(sha);
    } else {
      selectedPhotos.add(sha);
    }
    updateSelectionCount();
    updateMonthCheckboxStates();
  }

  // ----- People -----
  function loadPeople() {
    pageTitle.setAttribute('data-i18n', 'pageTitle.people');
    pageTitle.textContent = window.t ? window.t('pageTitle.people') : '👤 인물';
    api('/api/people').then(function(data) {
      renderPeople(data.people || []);
    }).catch(function(e) {
      console.warn('[photos] people load failed, showing empty state:', e && e.message);
      renderPeople([]);
    });
  }
  
  function renderPeople(people) {
    var peopleContainer = document.getElementById('people-container');
    peopleContainer.style.display = '';
    timeline.style.display = 'none';
    memoriesSection.style.display = 'none';
    albumsContainer.style.display = 'none';
    albumDetailContainer.style.display = 'none';
    mapContainer.style.display = 'none';
    
    var html = '<div class="people-grid">';
    people.forEach(function(person) {
      var coverUrl = person.cover_photo_id 
        ? window.appUrl('/api/library/asset/' + person.cover_photo_id + '/thumbnail')
        : '';

  // iframe-safe replacement for window.prompt — Promise<string|null>
  function uiPrompt(title, defaultValue) {
    return new Promise(function(resolve) {
      var modal = document.getElementById('ui-prompt-modal');
      var titleEl = document.getElementById('ui-prompt-title');
      var inputEl = document.getElementById('ui-prompt-input');
      var okBtn = document.getElementById('ui-prompt-ok');
      var cancelBtn = document.getElementById('ui-prompt-cancel');
      if (!modal) { resolve(null); return; }
      titleEl.textContent = title || '';
      inputEl.value = defaultValue || '';
      modal.classList.add('show');
      setTimeout(function() { inputEl.focus(); inputEl.select(); }, 30);

      function cleanup() {
        modal.classList.remove('show');
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        inputEl.removeEventListener('keydown', onKey);
        modal.removeEventListener('click', onOverlay);
      }
      function onOk() { var v = inputEl.value; cleanup(); resolve(v && v.trim() ? v.trim() : null); }
      function onCancel() { cleanup(); resolve(null); }
      function onKey(e) { if (e.key === 'Enter') onOk(); else if (e.key === 'Escape') onCancel(); }
      function onOverlay(e) { if (e.target === modal) onCancel(); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
      inputEl.addEventListener('keydown', onKey);
      modal.addEventListener('click', onOverlay);
    });
  }

  // iframe-safe confirm — Promise<boolean>. some iframe sandboxes block window.confirm
  function uiConfirm(message, opts) {
    var danger = !!(opts && opts.danger);
    return new Promise(function (resolve) {
      var modal = document.getElementById('ui-confirm-modal');
      var msgEl = document.getElementById('ui-confirm-message');
      var okBtn = document.getElementById('ui-confirm-ok');
      var cancelBtn = document.getElementById('ui-confirm-cancel');
      if (!modal || !msgEl || !okBtn || !cancelBtn) { resolve(window.confirm ? window.confirm(message) : false); return; }
      msgEl.textContent = message || '';
      okBtn.classList.toggle('danger', danger);
      modal.classList.add('show');
      okBtn.focus();
      function cleanup() {
        modal.classList.remove('show');
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        document.removeEventListener('keydown', onKey);
        modal.removeEventListener('click', onOverlay);
      }
      function onOk() { cleanup(); resolve(true); }
      function onCancel() { cleanup(); resolve(false); }
      function onKey(e) { if (e.key === 'Enter') onOk(); else if (e.key === 'Escape') onCancel(); }
      function onOverlay(e) { if (e.target === modal) onCancel(); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
      document.addEventListener('keydown', onKey);
      modal.addEventListener('click', onOverlay);
    });
  }

  // ----- Map -----
  function loadMap() {
    var lmpT = window.t || function(k,v){return k;};
    if (map) return;
    
    mapContainer.innerHTML = '<div id="map"></div>';
    
    api('/api/library/photos/geo').then(function(data) {
      if (!data.photos || data.photos.length === 0) {
        mapContainer.innerHTML = '<div class="empty"><div class="big">🗺️</div><div>' + lmpT('empty.noGps') + '</div></div>';
        return;
      }
      
      map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            'osm': {
              type: 'raster',
              tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
              tileSize: 256,
              attribution: '&copy; OpenStreetMap contributors'
            }
          },
          layers: [{
            id: 'osm',
            type: 'raster',
            source: 'osm'
          }]
        },
        center: [data.photos[0].lng, data.photos[0].lat],
        zoom: 10
      });
      
      // Cluster photos sharing the same approximate location (~11m grid)
      var groups = {};
      data.photos.forEach(function(photo) {
        var key = (Math.round(photo.lat * 10000) / 10000) + ',' + (Math.round(photo.lng * 10000) / 10000);
        if (!groups[key]) groups[key] = { lat: photo.lat, lng: photo.lng, photos: [] };
        groups[key].photos.push(photo);
      });

      Object.keys(groups).forEach(function(key) {
        var g = groups[key];
        var rep = g.photos[0];
        var count = g.photos.length;

        // Custom marker element: thumbnail + count badge
        var el = document.createElement('div');
        el.className = 'map-thumb-marker';
        var img = document.createElement('img');
        img.src = rep.thumbUrl;
        img.alt = '';
        el.appendChild(img);
        var badge = document.createElement('div');
        badge.className = 'map-thumb-badge';
        badge.textContent = String(count);

        // Popup: show up to 4 thumbnails when clustered

            popupHtml += '<a href="#" onclick="event.preventDefault(); openLightboxFromMap(\'' + p.sha256 + '\')"><img src="' + p.thumbUrl + '" style="width:60px;height:60px;object-fit:cover;border-radius:4px;"></a>';
          });

        }

        var marker = new maplibregl.Marker({ element: el })
          .setLngLat([g.lng, g.lat])

          .addTo(map);

  // ----- Render timeline -----
  function renderTimeline(items) {
    var rtT = window.t || function(k,v){return k;};
    if (!items.length) {
      // Customize empty state per filter — documents gets a "scan existing" CTA.
      var emptyIcon = document.getElementById('empty-icon');
      var emptyTitle = document.getElementById('empty-title');
      var emptyHint = document.getElementById('empty-hint');
      var emptyAction = document.getElementById('empty-action');
      if (currentFilter === 'documents') {
        if (emptyIcon) emptyIcon.textContent = '📄';
        if (emptyTitle) { emptyTitle.setAttribute('data-i18n', 'empty.noDocumentsTitle'); emptyTitle.textContent = rtT('empty.noDocumentsTitle'); }
        if (emptyHint) { emptyHint.setAttribute('data-i18n', 'empty.noDocumentsHint'); emptyHint.removeAttribute('data-i18n-html'); emptyHint.textContent = rtT('empty.noDocumentsHint'); }
        if (emptyAction) emptyAction.style.display = '';
      } else {
        if (emptyIcon) emptyIcon.textContent = '📷';
        if (emptyTitle) { emptyTitle.setAttribute('data-i18n', 'empty.noPhotosTitle'); emptyTitle.textContent = rtT('empty.noPhotosTitle'); }
        if (emptyHint) { emptyHint.setAttribute('data-i18n-html', 'empty.noPhotosHint'); emptyHint.removeAttribute('data-i18n'); emptyHint.innerHTML = rtT('empty.noPhotosHint'); }
        if (emptyAction) emptyAction.style.display = 'none';
      }
      emptyState.style.display = '';
      timeline.style.display = 'none';
      return;
    }
    emptyState.style.display = 'none';
    timeline.style.display = '';
    
    var groups = {};
    var groupOrder = [];
    items.forEach(function(it) {
      var key = fmtMonth(it.takenAt);
      if (!(key in groups)) { groups[key] = []; groupOrder.push(key); }
      groups[key].push(it);
    });
    
    var html = '';
    groupOrder.forEach(function(k) {
      // 월별 헤더 체크박스 (선택 모드일 때만 표시)
      var monthPhotos = groups[k].map(function(it) { return it.sha256; });
      var selectedInMonth = monthPhotos.filter(function(sha) { return selectedPhotos.has(sha); }).length;
      var allSelected = selectedInMonth === monthPhotos.length && monthPhotos.length > 0;
      var someSelected = selectedInMonth > 0 && selectedInMonth < monthPhotos.length;
      var checkboxHtml = selectionMode 
        ? '<input type="checkbox" class="month-checkbox" data-month-key="' + k + '"' + (allSelected ? ' checked' : '') + (someSelected ? ' data-indeterminate="true"' : '') + '>'
        : '';
      
      html += '<div class="month">' + checkboxHtml + k + '<span class="count">' + rtT('count.photos', { count: groups[k].length }) + '</span></div>';
      html += '<div class="grid">';
      groups[k].forEach(function(it) {
        var isTrashed = currentFilter === 'trash';
        var tileClass = isTrashed ? 'tile trashed' : 'tile';
        if (selectionMode) tileClass += ' selectable';
        if (selectedPhotos.has(it.sha256)) tileClass += ' selected';
        var isVideo = it.mediaType === 'video';
        var mediaHtml = isVideo
          ? '<video muted><source src="' + it.thumbnailUrl + '" type="image/webp"></video>'
          : '<img loading="lazy" draggable="true" ondragstart="window.__photoDragStart && window.__photoDragStart(event, \'' + it.sha256 + '\', \'' + (it.mediaType || 'image') + '\')" src="' + it.thumbnailUrl + '" alt="' + (it.filename || '') + '">';
        var actions = '';
        
        if (!isTrashed && !selectionMode) {
          // Categorizable views allow "remove from folder" in the kebab menu.
          var canRemoveFromCat = (currentFilter === 'documents' || currentFilter === 'screenshots' || currentFilter === 'businesscards');
          var moreLabel = rtT('menu.more');
          actions += '<div class="tile-actions">';
          actions += '<button class="tile-action' + (it.isFavorite ? ' active' : '') + '" data-action="favorite" data-sha="' + it.sha256 + '">⭐</button>';
          actions += '<button class="tile-action' + (it.isArchived ? ' active' : '') + '" data-action="archive" data-sha="' + it.sha256 + '">📦</button>';
          actions += '<button class="tile-action kebab" data-action="more" data-sha="' + it.sha256 + '" data-can-remove-cat="' + (canRemoveFromCat ? '1' : '0') + '" data-filename="' + (it.filename ? it.filename.replace(/"/g, '&quot;') : '') + '" title="' + moreLabel + '" aria-label="' + moreLabel + '">⋯</button>';
          actions += '</div>';
        } else if (isTrashed && !selectionMode) {
          actions += '<div class="tile-trash-actions">';
          actions += '<button class="tile-trash-btn" data-action="restore" data-sha="' + it.sha256 + '">' + rtT('common.restore') + '</button>';
          actions += '<button class="tile-trash-btn danger" data-action="delete" data-sha="' + it.sha256 + '">' + rtT('common.permanentDelete') + '</button>';
          actions += '</div>';
        }
        
        html += '<div class="' + tileClass + '" data-sha="' + it.sha256 + '" data-media-type="' + (it.mediaType || 'image') + '" data-month-key="' + k + '">' + mediaHtml + actions + '</div>';
      });
      html += '</div>';
    });
    timeline.innerHTML = html;

    // Attach handlers
    var assetMap = {};
    items.forEach(function(it) { assetMap[it.sha256] = it; });
    
    // 월별 헤더 체크박스 핸들러
    timeline.querySelectorAll('.month-checkbox').forEach(function(checkbox) {
      var monthKey = checkbox.getAttribute('data-month-key');
      
      // indeterminate 상태 설정
      if (checkbox.hasAttribute('data-indeterminate')) {
        checkbox.indeterminate = true;
      }
      
      checkbox.addEventListener('click', function(e) {
        e.stopPropagation();
        var monthPhotos = groups[monthKey].map(function(it) { return it.sha256; });
        var selectedInMonth = monthPhotos.filter(function(sha) { return selectedPhotos.has(sha); }).length;
        var shouldSelect = selectedInMonth < monthPhotos.length; // 전체 선택되지 않았으면 선택, 전체 선택되었으면 해제
        
        monthPhotos.forEach(function(sha) {
          if (shouldSelect) {
            selectedPhotos.add(sha);
          } else {
            selectedPhotos.delete(sha);
          }
          // UI 업데이트
          var tile = timeline.querySelector('.tile[data-sha="' + sha + '"]');
          if (tile) {
            if (shouldSelect) {
              tile.classList.add('selected');
            } else {
              tile.classList.remove('selected');
            }
          }
        });
        
        updateSelectionCount();
        // 체크박스 상태 즉시 업데이트
        checkbox.checked = shouldSelect;
        checkbox.indeterminate = false;
      });
    });
    
    timeline.querySelectorAll('.tile').forEach(function(tile) {
      // Shift+click 시 브라우저 텍스트 선택 방지 (mousedown 단계에서 차단해야 효과 있음)
      tile.addEventListener('mousedown', function(e) {
        if (selectionMode && e.shiftKey) e.preventDefault();
      });
      tile.addEventListener('click', function(e) {
        if (selectionMode) {
          e.preventDefault();
          e.stopPropagation();
          var sha = tile.getAttribute('data-sha');
          // Shift+click: 마지막 anchor부터 현재 타일까지 렌더 순서 기준 범위 강제 추가
          if (e.shiftKey && lastSelectedSha && lastSelectedSha !== sha) {
            var allTiles = Array.from(timeline.querySelectorAll('.tile'));
            var idxA = -1, idxB = -1;
            for (var i = 0; i < allTiles.length; i++) {
              var s = allTiles[i].getAttribute('data-sha');
              if (s === lastSelectedSha) idxA = i;
              if (s === sha) idxB = i;
            }
            if (idxA >= 0 && idxB >= 0) {
              var start = Math.min(idxA, idxB);
              var end = Math.max(idxA, idxB);
              for (var j = start; j <= end; j++) {
                var t = allTiles[j];
                var ts = t.getAttribute('data-sha');
                if (!selectedPhotos.has(ts)) {
                  selectedPhotos.add(ts);
                  t.classList.add('selected');
                }
              }
              updateSelectionCount();
              updateMonthCheckboxStates();
              lastSelectedSha = sha;
              if (window.getSelection) {
                try { window.getSelection().removeAllRanges(); } catch (_) {}
              }
              return;
            }
          }
          togglePhotoSelection(sha);
          tile.classList.toggle('selected');
          lastSelectedSha = sha;
        }
      });
    });
    
    timeline.querySelectorAll('.tile img, .tile video').forEach(function(media) {

        .catch(function(e) { showToast(haT('error.toastWrap', { error: e.message })); });
    } else if (action === 'archive') {
      api('/api/library/' + sha + '/archive', { method: 'POST' })
        .then(function(r) { showToast(r.isArchived ? haT('toast.archived') : haT('toast.archiveUndone')); refreshView(); })
        .catch(function(e) { showToast(haT('error.toastWrap', { error: e.message })); });
    } else if (action === 'trash') {
      api('/api/library/' + sha + '/trash', { method: 'POST' })
        .then(function() { showToast(haT('toast.trashed')); refreshView(); })
        .catch(function(e) { showToast(haT('error.toastWrap', { error: e.message })); });
    } else if (action === 'restore') {
      api('/api/library/' + sha + '/restore', { method: 'POST' })
        .then(function() { showToast(haT('toast.restored')); refreshView(); })
        .catch(function(e) { showToast(haT('error.toastWrap', { error: e.message })); });
    } else if (action === 'delete') {
      uiConfirm(haT('confirm.permanentDelete'), { danger: true }).then(function(ok) {

          .catch(function(e) { showToast(haT('error.toastWrap', { error: e.message })); });

  var __tileMenuEl = null;

  function __getTileMenu() {
    if (__tileMenuEl) return __tileMenuEl;
    var el = document.createElement('div');

  function __closeTileMenu() {
    if (__tileMenuEl) {

  function __openTileMenu(btn) {
    var sha = btn.getAttribute('data-sha');
    var canRm = btn.getAttribute('data-can-remove-cat') === '1';
    var filename = btn.getAttribute('data-filename') || (sha + '.jpg');
    if (__tileMenuOpenSha === sha) { __closeTileMenu(); return; }

    menu.innerHTML = html;
    menu.classList.add('open');
    var rect = btn.getBoundingClientRect();
    // Position below-right of the kebab, clamp to viewport right edge.
    var top = rect.bottom + 4;
    var right = Math.max(8, window.innerWidth - rect.right);
    menu.style.top = top + 'px';
    menu.style.right = right + 'px';
    menu.style.left = 'auto';
    __tileMenuOpenSha = sha;

    menu.querySelectorAll('button[data-tm-action]').forEach(function(b) {

    });
  }
  // Global outside-click + Esc + scroll/resize close.
  document.addEventListener('click', function(ev) {
    if (!__tileMenuOpenSha) return;

    // Clicks inside the menu are handled by item listeners (which stopPropagation).

  // ----- Thumbnail zoom (buttons + pinch) -----
  (function() {
    // 데스크톱은 --thumb-size(px)로 auto-fill, 모바일은 --thumb-cols(정수)로 컬럼 수 직접 제어
    // (모바일 전용 .grid 규칙이 !important로 --thumb-size를 무시했던 것이 버튼 무반응의 원인)
    var LEVELS = [
      { size: 100, cols: 4 },
      { size: 140, cols: 3 },
      { size: 180, cols: 2 },
      { size: 240, cols: 1 }
    ];
    var STORAGE_KEY = 'photos.gridCols';
    function clampIdx(i) { return Math.max(0, Math.min(LEVELS.length - 1, i)); }
    function readIdx() {
      var v = parseInt(localStorage.getItem(STORAGE_KEY) || '', 10);
      if (isNaN(v)) return 0; // 기본값: 4컬럼(축소 상태)
      for (var i = 0; i < LEVELS.length; i++) { if (LEVELS[i].cols === v) return i; }
      return 0;
    }
    var idx = readIdx();
    function apply() {
      idx = clampIdx(idx);
      var level = LEVELS[idx];
      document.documentElement.style.setProperty('--thumb-size', level.size + 'px');
      document.documentElement.style.setProperty('--thumb-cols', String(level.cols));
      try { localStorage.setItem(STORAGE_KEY, String(level.cols)); } catch (_) {}
      var btnIn = document.getElementById('btn-thumb-zoom-in');
      var btnOut = document.getElementById('btn-thumb-zoom-out');
      if (btnIn) btnIn.disabled = (idx >= LEVELS.length - 1);
      if (btnOut) btnOut.disabled = (idx <= 0);
    }
    apply();
    var inBtn = document.getElementById('btn-thumb-zoom-in');
    var outBtn = document.getElementById('btn-thumb-zoom-out');
    if (inBtn) inBtn.addEventListener('click', function() { idx++; apply(); });
    if (outBtn) outBtn.addEventListener('click', function() { idx--; apply(); });

    // 핀치 줌 (Chrome/Android: touchmove 2-finger, Safari: gesturechange)
    var pinchBase = null; // {dist, idx}
    function distance(t1, t2) {
      var dx = t1.clientX - t2.clientX;
      var dy = t1.clientY - t2.clientY;
      return Math.hypot(dx, dy);
    }
    timeline.addEventListener('touchstart', function(ev) {
      if (ev.touches && ev.touches.length === 2) {
        pinchBase = { dist: distance(ev.touches[0], ev.touches[1]), idx: idx };
      }
    }, { passive: true });
    timeline.addEventListener('touchmove', function(ev) {
      if (pinchBase && ev.touches && ev.touches.length === 2) {
        var d = distance(ev.touches[0], ev.touches[1]);
        var ratio = d / pinchBase.dist;
        var next = pinchBase.idx;
        if (ratio > 1.25) next = pinchBase.idx + 1;
        else if (ratio < 0.8) next = pinchBase.idx - 1;
        if (next !== idx) { idx = clampIdx(next); apply(); }
      }
    }, { passive: true });
    timeline.addEventListener('touchend', function(ev) {
      if (!ev.touches || ev.touches.length < 2) pinchBase = null;
    }, { passive: true });
    // Safari gesture events
    timeline.addEventListener('gesturestart', function(ev) {
      ev.preventDefault();
      pinchBase = { dist: 1, idx: idx };
    });
    timeline.addEventListener('gesturechange', function(ev) {
      ev.preventDefault();
      if (!pinchBase) return;
      var ratio = ev.scale;
      var next = pinchBase.idx;
      if (ratio > 1.25) next = pinchBase.idx + 1;
      else if (ratio < 0.8) next = pinchBase.idx - 1;
      if (next !== idx) { idx = clampIdx(next); apply(); }
    });
    timeline.addEventListener('gestureend', function() { pinchBase = null; });
  })();

      showToast('🔄 OCR 처리 중… (' + photoIds.length + '장, 캐시 미사용분은 수십 초 소요)', 600000);
      fetch('/api/ocr/batch-document', {
        method: 'POST',

        body: JSON.stringify({ photoIds: photoIds, format: opts.format, title: opts.title || undefined }),
      }).then(function(r) {
        return r.json().then(function(j) { return { ok: r.ok, data: j }; });
      }).then(function(res) {
        if (!res.ok || !res.data.ok) throw new Error(res.data.error || ('HTTP ' + (res.data.status || '?')));
        var data = res.data;
        // 다운로드 자동 트리거
        var a = document.createElement('a');
        a.href = data.downloadUrl;
        a.download = data.downloadFileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        var msg = '✅ OCR 문서 생성 완료 — ' + data.itemsCount + '장';
        if (data.failedCount > 0) msg += ' (인식 실패 ' + data.failedCount + ')';
        if (data.library && data.library.libraryFileName) {
          msg += ' · 자료실 추가됨';
        } else if (data.library && data.library.error) {
          msg += ' · 자료실 추가 실패(' + data.library.error + ')';
        }
        showToast(msg, 7000);
        toggleSelectionMode();
      }).catch(function(e) {

      });
    });

      var origLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = rT('msg.docOcrRunning');

        method: 'POST',

        body: JSON.stringify({ limit: 50 })
      }).then(function(data) {
        if (!data || data.scanned === 0) {
          showToast(rT('msg.docOcrNoCandidate'), 4000);
        } else {
          var msg = rT('msg.docOcrDone', { scanned: data.scanned, classified: data.classifiedAsDocument });
          // Fallback for runtimes that don't interpolate.
          msg = msg.replace('{scanned}', data.scanned).replace('{classified}', data.classifiedAsDocument);
          showToast('✅ ' + msg, 5000);
          if (typeof refreshCounts === 'function') refreshCounts();
          if (currentFilter === 'documents' && typeof refreshView === 'function') refreshView();
        }
      }).catch(function(e) {
        showToast('❌ ' + (e && e.message ? e.message : e), 6000);

        btn.disabled = false;
        btn.textContent = origLabel;
      });

  // ----- Lightbox -----
  var lightboxVideo = document.getElementById('lightbox-video');
  
  function openLightbox(it) {
    var isVideo = it.mediaType === 'video';
    currentPhotoSha = it.sha256;
    
    if (isVideo) {
      lightboxImg.style.display = 'none';
      lightboxVideo.style.display = '';
      lightboxVideo.src = '/api/library/photos/' + it.sha256 + '/stream';
      lightboxVideo.load();
    } else {
      lightboxVideo.style.display = 'none';
      lightboxImg.style.display = '';
      lightboxImg.src = it.originalUrl;
    }
    
    
    // Step 3-4: Check proxy for videos
    if (it.mediaType === 'video') {
      api('/api/library/photos/' + it.sha256 + '/proxy').then(function(proxyData) {
        if (proxyData.status === 'done' && proxyData.proxyUrl) {
          lightboxVideo.src = proxyData.proxyUrl;
        }
      }).catch(function() {
        // Keep original if proxy check fails
      });
    }
    
    lightbox.classList.add('show');
    
    // LivePhoto hover playback (Step 3-3)
    api('/api/library/photos/' + it.sha256 + '/livephoto').then(function(data) {
      if (data.pair && data.pair.video_sha) {
        var videoUrl = window.appUrl('/api/library/asset/' + data.pair.video_sha + '/original');
        
        // Create hover video element
        var hoverDiv = document.createElement('div');
        hoverDiv.className = 'livephoto-hover';
        var hoverVideo = document.createElement('video');
        hoverVideo.src = videoUrl;
        hoverVideo.loop = false;
        hoverVideo.muted = true;
        hoverDiv.appendChild(hoverVideo);
        
        var lightboxMain = document.querySelector('.lightbox-main');
        lightboxMain.appendChild(hoverDiv);
        
        // Hover event
        lightboxMain.addEventListener('mouseenter', function() {
          hoverDiv.style.display = 'block';
          hoverVideo.currentTime = 0;
          hoverVideo.play();
        });
        
        lightboxMain.addEventListener('mouseleave', function() {
          hoverVideo.pause();
          hoverDiv.style.display = 'none';
        });
      }
    }).catch(function() {
      // Not a LivePhoto, skip
