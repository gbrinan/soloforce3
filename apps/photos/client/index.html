        if (bc.confidence) bcHtml += '<div class="exif-row"><span class="exif-label">' + bcT('bc.confidence') + '</span><span class="exif-value">' + Math.round(bc.confidence * 100) + '%</span></div>';
        
        document.getElementById('businesscard-data').innerHTML = bcHtml;
        document.getElementById('businesscard-section').style.display = '';

        // D&D — make the contact card draggable so the user can drop it onto the host chat.
        // The host listens for window 'message' events (source=mycrew-photos, type=contact.*)
        // and renders a drop overlay on its chat surface. Native dataTransfer is also set so
        // same-frame drop targets can read it directly.
        (function wireBcDragAndDrop() {
          var bcSection = document.getElementById('businesscard-section');
          if (!bcSection) return;
          var payload = {
            type: 'businesscard',
            sha256: it.sha256,
            name: bc.name || '',
            phones: bc.phones || [],
            emails: bc.emails || [],
            company: bc.company || '',
            department: bc.department || '',
            position: bc.position || '',
          };
          // Build a host-chat attachment (note) from the contact fields so the
          // host composer can render it like a markdown attachment on drop.
          function buildContactAttachment() {
            var lines = [];
            if (payload.name) lines.push(payload.name);
            var titleParts = [];
            if (payload.position) titleParts.push(payload.position);
            if (payload.department) titleParts.push(payload.department);
            if (payload.company) titleParts.push(payload.company);
            if (titleParts.length) lines.push(titleParts.join(' · '));
            if (payload.phones && payload.phones.length) lines.push('전화: ' + payload.phones.join(', '));
            if (payload.emails && payload.emails.length) lines.push('이메일: ' + payload.emails.join(', '));
            return {
              type: 'note',
              name: '연락처: ' + (payload.name || '이름없음'),
              content: lines.join('\n'),
            };
          }
          bcSection.setAttribute('draggable', 'true');
          bcSection.style.cursor = 'grab';
          bcSection.ondragstart = function(ev) {
            var attachment = buildContactAttachment();
            try {
              if (ev.dataTransfer) {
                ev.dataTransfer.setData('application/x-mycrew-contact', JSON.stringify(payload));
                ev.dataTransfer.setData('application/x-mycrew-attachment', JSON.stringify(attachment));
                ev.dataTransfer.setData('text/plain',
                  (payload.name || '') +
                  (payload.phones.length ? ' ' + payload.phones.join(' ') : '') +
                  (payload.emails.length ? ' ' + payload.emails.join(' ') : ''));
                ev.dataTransfer.effectAllowed = 'copy';
              }
            } catch (_) {}
            bcSection.classList.add('dragging');
            postHost('contact.dragstart', payload);
            try { window.parent.postMessage({ source: 'mycrew-photos', type: 'drag.start', payload: { attachment: attachment } }, HOST_ORIGIN); } catch (_) {}
          };
          bcSection.ondragend = function() {
            bcSection.classList.remove('dragging');
            postHost('contact.dragend', { sha256: payload.sha256 });
            try { window.parent.postMessage({ source: 'mycrew-photos', type: 'drag.end' }, HOST_ORIGIN); } catch (_) {}
          };
        })();

        // Sync button handler
        document.getElementById('btn-bc-sync-to-host').onclick = function() {
          api('/api/photos/' + it.sha256 + '/businesscard-sync', { method: 'POST' }).then(function(r) {
            if (r.ok) {
              showToast('✅ ' + bcT('msg.bcSyncSuccess'), 3000);
            } else {
              showToast('❌ ' + bcT('msg.bcSyncFailed') + ': ' + (r.reason || 'unknown'), 5000);
            }
          }).catch(function(e) {
            showToast('❌ ' + bcT('msg.bcSyncError') + ': ' + e.message, 5000);
          });
        };
        
        // Rescan button handler
        document.getElementById('btn-bc-rescan').onclick = function() {
          api('/api/photos/' + it.sha256 + '/businesscard-ocr', { method: 'POST' }).then(function(r) {
            showToast('✅ ' + bcT('msg.bcRescanSuccess'), 3000);
            // Surface auto-sync outcome so user knows whether the contact
            // actually reached the host (previously silent on no-token).
            if (r && r.syncStatus === 'failed') {
              showToast('❌ ' + bcT('msg.bcSyncFailed') + ': ' + (r.syncReason || 'unknown'), 5000);
            } else if (r && r.syncStatus === 'skipped' && r.syncReason && r.syncReason !== 'autoAdd-disabled') {
              showToast('⚠️ ' + bcT('msg.bcSyncFailed') + ': ' + r.syncReason, 5000);
            }
            // Reload business card data
            setTimeout(function() {
              api('/api/photos/' + it.sha256 + '/businesscard').then(function(data2) {
                if (data2.businesscard) {
                  var bc2 = data2.businesscard;
                  var bcHtml2 = '';
                  if (bc2.name) bcHtml2 += '<div class="exif-row"><span class="exif-label">' + bcT('bc.name') + '</span><span class="exif-value">' + bc2.name + '</span></div>';
                  if (bc2.phones && bc2.phones.length > 0) bcHtml2 += '<div class="exif-row"><span class="exif-label">' + bcT('bc.phone') + '</span><span class="exif-value">' + bc2.phones.join(', ') + '</span></div>';
                  if (bc2.emails && bc2.emails.length > 0) bcHtml2 += '<div class="exif-row"><span class="exif-label">' + bcT('bc.email') + '</span><span class="exif-value">' + bc2.emails.join(', ') + '</span></div>';
                  if (bc2.company) bcHtml2 += '<div class="exif-row"><span class="exif-label">' + bcT('bc.company') + '</span><span class="exif-value">' + bc2.company + '</span></div>';
                  if (bc2.department) bcHtml2 += '<div class="exif-row"><span class="exif-label">' + bcT('bc.department') + '</span><span class="exif-value">' + bc2.department + '</span></div>';
                  if (bc2.position) bcHtml2 += '<div class="exif-row"><span class="exif-label">' + bcT('bc.position') + '</span><span class="exif-value">' + bc2.position + '</span></div>';
                  if (bc2.confidence) bcHtml2 += '<div class="exif-row"><span class="exif-label">' + bcT('bc.confidence') + '</span><span class="exif-value">' + Math.round(bc2.confidence * 100) + '%</span></div>';
                  document.getElementById('businesscard-data').innerHTML = bcHtml2;
                }
              });
            }, 1000);
          }).catch(function(e) {
            showToast('❌ ' + bcT('msg.bcRescanError') + ': ' + e.message, 5000);
          });
        };
      } else {
        document.getElementById('businesscard-section').style.display = 'none';
      }
    }).catch(function() {
      document.getElementById('businesscard-section').style.display = 'none';
    });
    
    // OCR buttons
    var ocrTT = window.t || function(k,v){return k;};
    var btnRunOcr = document.getElementById('btn-run-ocr');
    var btnRunPlate = document.getElementById('btn-run-plate');
    var ocrText = document.getElementById('ocr-text');
    
    // Check if OCR already exists
    api('/api/photos/' + it.sha256 + '/ocr').then(function(data) {
      ocrText.innerHTML = '<strong>' + ocrTT('ocr.receiptHeader') + '</strong><br>' + (data.text || ocrTT('ocr.empty'));
      ocrText.style.color = 'var(--text-primary)';
    }).catch(function() {
      ocrText.textContent = ocrTT('empty.ocrIdle');
    });
    
    // Check if plate OCR exists
    api('/api/photos/' + it.sha256 + '/plates').then(function(data) {
      ocrText.innerHTML += '<br><strong>' + ocrTT('ocr.plateLabel') + '</strong> ' + (data.plateNumber || ocrTT('ocr.empty'));
    }).catch(function() {});
    
    btnRunOcr.onclick = function() {
      btnRunOcr.disabled = true;
      btnRunOcr.textContent = ocrTT('btn.processing');
      api('/api/photos/' + it.sha256 + '/ocr', { method: 'POST' })
        .then(function(data) {
          ocrText.innerHTML = '<strong>' + ocrTT('ocr.receiptHeader') + '</strong><br>' + data.text;
          ocrText.style.color = 'var(--text-primary)';
          btnRunOcr.textContent = ocrTT('btn.done');
          setTimeout(function() {
            btnRunOcr.disabled = false;
            btnRunOcr.textContent = ocrTT('btn.runReceiptOcrRetry');
          }, 2000);
        })
        .catch(function(e) {
          ocrText.textContent = ocrTT('error.genericFailed', { error: e.message });
          ocrText.style.color = 'var(--accent-danger)';
          btnRunOcr.disabled = false;
          btnRunOcr.textContent = ocrTT('btn.runReceiptOcr');
        });
    };
    
    btnRunPlate.onclick = function() {
      btnRunPlate.disabled = true;
      btnRunPlate.textContent = ocrTT('btn.processing');
      api('/api/photos/' + it.sha256 + '/plates', { method: 'POST' })
        .then(function(data) {
          ocrText.innerHTML += '<br><strong>' + ocrTT('ocr.plateLabel') + '</strong> ' + data.plateNumber;
          btnRunPlate.textContent = ocrTT('btn.done');
          setTimeout(function() {
            btnRunPlate.disabled = false;
            btnRunPlate.textContent = ocrTT('btn.runPlateOcrRetry');
          }, 2000);
        })
        .catch(function(e) {
          ocrText.innerHTML += '<br><strong>' + ocrTT('ocr.plateLabel') + '</strong> ' + ocrTT('ocr.plateFailedPrefix', { error: e.message });
          ocrText.style.color = 'var(--accent-danger)';
          btnRunPlate.disabled = false;
          btnRunPlate.textContent = ocrTT('btn.runPlateOcr');
        });
    };
    
    // Phase 6: Load rating, tags, share
    api('/api/library/photos/' + currentPhotoSha).then(function(data) {
      var rating = data.rating || 0;
      updateRatingStars(rating);
    }).catch(function() {});
    
    api('/api/photos/' + currentPhotoSha + '/tags').then(function(data) {
      var tags = data.tags || [];
      displayTags(tags, currentPhotoSha);
    }).catch(function() {});
    
    var shT = window.t || function(k,v){return k;};
    api('/api/photos/' + currentPhotoSha + '/share').then(function(data) {
      if (data.token) {
        var link = location.origin + data.url;
        document.getElementById('share-link-result').innerHTML = '<a href="' + link + '" target="_blank" style="color:var(--ring);">' + link + '</a><br><button class="btn" onclick="copyShareLink(\'' + link + '\')" style="margin-top:4px;width:100%;">' + shT('btn.copy') + '</button>';
      } else {
        document.getElementById('share-link-result').textContent = shT('empty.noShareLink');
      }
    }).catch(function() {
      document.getElementById('share-link-result').textContent = shT('empty.noShareLink');
    });
  }
  
  function closeLightbox() {
    lightbox.classList.remove('show');
    lightboxImg.src = '';
    lightboxVideo.pause();
    lightboxVideo.src = '';
    
    // Clean up LivePhoto hover elements
    var hoverDiv = document.querySelector('.livephoto-hover');
    if (hoverDiv) hoverDiv.remove();
  }
  
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && lightbox.classList.contains('show')) closeLightbox();
  });

  // ----- Phase 6: Rating, Tags, Share, Watch -----
  var currentPhotoSha = null;
  
  function updateRatingStars(rating) {
    document.querySelectorAll('#rating-stars span').forEach(function(star, idx) {
      star.textContent = (idx < rating) ? '★' : '☆';
    });
  }
  
  function displayTags(tags, sha) {
    var dtT = window.t || function(k,v){return k;};
    var html = '';
    tags.forEach(function(tag) {
      html += '<span style="display:inline-block;padding:4px 8px;margin:2px;background:var(--bg-elevated);color:var(--text-primary);border-radius:var(--radius-sm);font-size:var(--font-s);">' + tag + ' <button onclick="removeTag(\'' + sha + '\', \'' + tag + '\')" style="background:none;border:none;color:var(--text-primary);cursor:pointer;font-size:var(--font-s);">✕</button></span>';
    });
    document.getElementById('photo-tags').innerHTML = html || '<span style="color:var(--text-muted);">' + dtT('empty.noTags') + '</span>';
  }
  
  window.removeTag = function(sha, tag) {
    var rtgT = window.t || function(k,v){return k;};
    api('/api/photos/' + sha + '/tags/' + encodeURIComponent(tag), { method: 'DELETE' })
      .then(function() {
        api('/api/photos/' + sha + '/tags').then(function(data) {
          displayTags(data.tags || [], sha);
        });
        showToast(rtgT('toast.tagRemoved', { tag: tag }));
      }).catch(function(e) {
        showToast(rtgT('error.genericFailed', { error: e.message }));
      });
  };
  
  window.copyShareLink = function(link) {
    var cslT = window.t || function(k,v){return k;};
    navigator.clipboard.writeText(link).then(function() {
      showToast(cslT('toast.linkCopied'));
    }).catch(function() {
      showToast(cslT('toast.copyFailed'));
    });
  };
  
  function loadWatchFolders() {
    var lwfT = window.t || function(k,v){return k;};
    api('/api/watched-folders').then(function(data) {
      var folders = data.folders || [];
      if (folders.length === 0) {
        document.getElementById('watch-folders-list').innerHTML = '<span style="color:var(--text-muted);">' + lwfT('empty.noWatchedFolders') + '</span>';
      } else {
        var html = '';
        folders.forEach(function(f) {
          html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-default);"><span style="flex:1;color:var(--text-primary);">' + f.path + '</span><button class="btn" onclick="removeWatchFolder(' + f.id + ')" style="padding:4px 8px;font-size:var(--font-s);">✕</button></div>';
        });
        document.getElementById('watch-folders-list').innerHTML = html;
      }
    }).catch(function() {
      document.getElementById('watch-folders-list').innerHTML = '<span style="color:var(--accent-danger);">' + lwfT('error.loadFailed', { error: '' }) + '</span>';
    });
  }
  
  window.removeWatchFolder = function(id) {
    var rwfT = window.t || function(k,v){return k;};
    api('/api/watched-folders/' + id, { method: 'DELETE' })
      .then(function() {
        loadWatchFolders();
        showToast(rwfT('toast.watchStopped'));
      }).catch(function(e) {
        showToast(rwfT('error.genericFailed', { error: e.message }));
      });
  };
  
  document.getElementById('btn-settings').addEventListener('click', function() {
    document.getElementById('settings-modal').classList.add('show');
    loadWatchFolders();
  });
  
  document.getElementById('btn-close-settings').addEventListener('click', function() {
    document.getElementById('settings-modal').classList.remove('show');
  });

  // ----- Language selector (mycrew-system 'jarvis-lang' sync) -----
  document.querySelectorAll('[data-lang]').forEach(function (langBtn) {
    langBtn.addEventListener('click', function () {
      var lang = langBtn.getAttribute('data-lang');
      if (window.i18n && window.i18n.setLang) {
        window.i18n.setLang(lang);
      }
      syncLangActive();
      var lsT = window.t || function(k,v){return k;};
      showToast(lsT('toast.languageChanged'));
    });
  });
  syncLangActive();
  window.addEventListener('i18n:changed', syncLangActive);

  // Re-render dynamic content when language changes (cross-tab sync via storage event too)
  window.addEventListener('i18n:changed', function () {
    refreshView();
  });
  window.addEventListener('storage', function (e) {
    if (e && e.key === 'jarvis-lang' && window.i18n && window.i18n.applyI18nDOM) {
      window.i18n.applyI18nDOM(document.body);
      refreshView();
    }
  });
  
  document.getElementById('btn-add-watch-folder').addEventListener('click', function() {
    var path = document.getElementById('watch-folder-input').value.trim();
    if (!path) return;
    api('/api/watched-folders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path }),
    }).then(function() {
      document.getElementById('watch-folder-input').value = '';
      loadWatchFolders();
      var awfT = window.t || function(k,v){return k;};
      showToast(awfT('toast.watchStarted', { path: path }));
    }).catch(function(e) {
      var awfT2 = window.t || function(k,v){return k;};
      showToast(awfT2('error.genericFailed', { error: e.message }));
    });
  });
  
  document.querySelectorAll('#rating-stars span').forEach(function(star) {
    star.addEventListener('click', function() {
      var rsT = window.t || function(k,v){return k;};
      var rating = Number(star.getAttribute('data-rating'));
      if (!currentPhotoSha) return;
      api('/api/photos/' + currentPhotoSha, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rating: rating }),
      }).then(function() {
        updateRatingStars(rating);
        showToast(rsT('toast.ratingSet', { rating: rating }));
      }).catch(function(e) {
        showToast(rsT('error.genericFailed', { error: e.message }));
      });
    });
  });
  
  document.getElementById('tag-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var tagT = window.t || function(k,v){return k;};
      var tag = e.target.value.trim();
      if (!tag || !currentPhotoSha) return;
      api('/api/photos/' + currentPhotoSha + '/tags', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tag: tag }),
      }).then(function() {
        e.target.value = '';
        api('/api/photos/' + currentPhotoSha + '/tags').then(function(data) {
          displayTags(data.tags || [], currentPhotoSha);
        });
        showToast(tagT('toast.tagAdded', { tag: tag }));
      }).catch(function(err) {
        showToast(tagT('error.genericFailed', { error: err.message }));
      });
    }
  });
  
  document.getElementById('btn-create-share').addEventListener('click', function() {
    if (!currentPhotoSha) return;
    api('/api/photos/' + currentPhotoSha + '/share', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          password: document.getElementById('share-password').value.trim() || undefined
        })
      })
      .then(function(data) {
        var csT = window.t || function(k,v){return k;};
        var link = location.origin + data.url;
        document.getElementById('share-link-result').innerHTML = '<a href="' + link + '" target="_blank" style="color:var(--ring);">' + link + '</a><br><button class="btn" onclick="copyShareLink(\'' + link + '\')" style="margin-top:4px;width:100%;">' + csT('btn.copy') + '</button>';
        showToast(csT('toast.shareLinkCreated'));
      }).catch(function(e) {
        var csT2 = window.t || function(k,v){return k;};
        showToast(csT2('error.genericFailed', { error: e.message }));
      });
  });

  // ----- Theme toggle (mycrew-system 디자인 토큰) -----
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    var btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
    document.querySelectorAll('[data-theme-set]').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-theme-set') === theme);
    });
  }

  function syncLangActive() {
    var current = 'ko';
    try {
      current = (window.i18n && window.i18n.getLang && window.i18n.getLang())
                || localStorage.getItem('jarvis-lang') || 'ko';
    } catch (_) {}
    document.querySelectorAll('[data-lang]').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === current);
    });
  }
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem('mycrew-photos-theme'); } catch (_) {}
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    applyTheme(saved || (prefersLight ? 'light' : 'dark'));
  }
  initTheme();
  // 설정 모달 안의 테마 선택 버튼 (라이트/다크)
  document.querySelectorAll('[data-theme-set]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var theme = btn.getAttribute('data-theme-set') || 'dark';
      applyTheme(theme);
      try { localStorage.setItem('mycrew-photos-theme', theme); } catch (_) {}
    });
  });

  // ----- Sidebar collapse toggle (localStorage 보존) -----
  (function () {
    var sidebar = document.getElementById('sidebar');
    var toggle = document.getElementById('sidebar-toggle');
    if (!sidebar || !toggle) return;
    var KEY = 'mycrew-photos-sidebar-collapsed';
    function isMobile() { return window.matchMedia('(max-width: 720px)').matches; }
    try {
      if (localStorage.getItem(KEY) === '1') sidebar.classList.add('collapsed');
    } catch (_) {}
    toggle.addEventListener('click', function () {
      if (isMobile()) return; // 모바일에서는 별도 오버레이 핸들러가 처리
      sidebar.classList.toggle('collapsed');
      try { localStorage.setItem(KEY, sidebar.classList.contains('collapsed') ? '1' : '0'); } catch (_) {}
    });
  })();

  // ----- Mobile sidebar overlay (햄버거 + 백드롭) -----
  (function () {
    var sidebar = document.getElementById('sidebar');
    var backdrop = document.getElementById('sidebar-backdrop');
    var menuBtn = document.getElementById('mobile-menu-btn');
    var toggle = document.getElementById('sidebar-toggle');
    if (!sidebar) return;
    function isMobile() { return window.matchMedia('(max-width: 720px)').matches; }
    function open() {
      sidebar.classList.add('mobile-open');
      if (backdrop) backdrop.classList.add('show');
    }
    function close() {
      sidebar.classList.remove('mobile-open');
      if (backdrop) backdrop.classList.remove('show');
    }
    if (menuBtn) menuBtn.addEventListener('click', function () {
      if (isMobile()) {
        sidebar.classList.contains('mobile-open') ? close() : open();
      } else {
        sidebar.classList.toggle('collapsed');
      }
    });
    if (backdrop) backdrop.addEventListener('click', close);
    if (toggle) toggle.addEventListener('click', function () {
      if (isMobile()) close();
    });
    document.querySelectorAll('.sidebar-item').forEach(function (item) {
      item.addEventListener('click', function () { if (isMobile()) close(); });
    });
    window.addEventListener('resize', function () { if (!isMobile()) close(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && isMobile()) close();
    });
  })();

  // ----- WebSocket bus -----
  function connectBus() {
    var bsT = window.t || function(k,v){return k;};
    var token = new URLSearchParams(location.search).get('token') || '';
    var url = 'ws://' + location.host + '/bus' + (token ? '?token=' + token : '');
    try {
      var ws = new WebSocket(url);
      ws.onopen = function() { busStatus.textContent = bsT('bus.connected'); };
      ws.onclose = function() { busStatus.textContent = bsT('bus.disconnected'); setTimeout(connectBus, 3000); };
      ws.onmessage = function(ev) {
        try {
          var m = JSON.parse(ev.data);
          if (m.type === 'library.imported' || m.type === 'library.updated' || m.type === 'library.deleted') {
            refreshView();
          }
        } catch (_) {}
      };
    } catch (e) {
      busStatus.textContent = bsT('bus.failed');
    }
  }
  connectBus();

  postHost('app.ready', { app: 'photos', version: '0.4.0' });
  refreshView();
})();
</script>
</body>
</html>
